<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>React Academy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktive React-Schulung mit Live-Beispielen im Browser.">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#087ea4">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('react-academy.theme'));
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
