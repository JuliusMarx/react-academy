<!doctype html>
<html lang="de" data-locked>
<head>
  <meta charset="utf-8">
  <title>React Academy</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interaktive React-Schulung mit Live-Beispielen im Browser.">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#087ea4">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('react-academy.theme'));
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      if (JSON.parse(localStorage.getItem('react-academy.reading-mode')) === 'short') document.documentElement.dataset.reading = 'short';
    } catch (e) {}
  </script>
  <!--
    Access-code gate – a privacy screen, not real protection: the pages are prerendered, so their
    content is in the HTML. It keeps casual visitors and search engines out. Set or change the code
    with "npm run access-code" (only its hash is stored here).
  -->
  <script>
    var ACCESS = { key: 'react-academy.access', hash: '362d7710b2c735cd9ee3a223a05f9ae468b01ff71591238cf81c8557008d9e82' };
    try {
      if (ACCESS.hash && localStorage.getItem(ACCESS.key) === ACCESS.hash) document.documentElement.removeAttribute('data-locked');
    } catch (e) {}
  </script>
  <style>
    html[data-locked] body > :not(#gate) { display: none !important; }
    html:not([data-locked]) #gate { display: none; }
    #gate { display: grid; place-items: center; min-height: 100vh; padding: 1rem; }
    #gate form { display: grid; gap: 0.75rem; width: min(22rem, 100%); padding: 2rem 1.5rem; border: 1px solid var(--border); border-radius: 0.75rem; background: var(--surface); }
    #gate h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    #gate label { font-weight: 600; }
    #gate input { padding: 0.55rem 0.8rem; border: 1px solid var(--border-strong); border-radius: 0.5rem; background: var(--bg); color: var(--text); font: inherit; }
    #gate p { margin: 0; min-height: 1.5em; color: var(--danger); font-size: 0.92rem; }
  </style>
</head>
<body>
  <main id="gate">
    <form>
      <h1>React Academy</h1>
      <label for="gate-code">Zugangscode / Access code</label>
      <input id="gate-code" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="button">Weiter / Continue</button>
      <p id="gate-error" role="alert"></p>
    </form>
  </main>
  <script>
    // While locked, the tab shows only the site name, not the page title (the app keeps setting it).
    var gateTitle = document.querySelector('#gate h1').textContent;
    var pageTitle = document.title;
    var titleWatch = null;
    if (document.documentElement.hasAttribute('data-locked')) {
      document.title = gateTitle;
      titleWatch = new MutationObserver(function () {
        if (document.title !== gateTitle) {
          pageTitle = document.title;
          document.title = gateTitle;
        }
      });
      titleWatch.observe(document.head, { childList: true, characterData: true, subtree: true });
    }
    document.querySelector('#gate form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var input = document.getElementById('gate-code');
      var error = document.getElementById('gate-error');
      var bytes = new TextEncoder().encode(ACCESS.key + ':' + input.value.trim());
      var digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
      var hash = Array.from(digest, function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      if (!ACCESS.hash || hash !== ACCESS.hash) {
        error.textContent = 'Falscher Code. / Wrong code.';
        input.select();
        return;
      }
      try { localStorage.setItem(ACCESS.key, hash); } catch (e) {}
      document.documentElement.removeAttribute('data-locked');
      if (titleWatch) titleWatch.disconnect();
      document.title = pageTitle;
      document.getElementById('main')?.focus();
    });
  </script>
  <app-root></app-root>
</body>
</html>
